# Vercel Configuration Setup
# Note: Vercel natively utilizes vercel.json (also configured in root) and .github/workflows/vercel.yml for GitHub Actions.

version: 2
cleanUrls: true

headers:
  - source: "/(.*)"
    headers:
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-XSS-Protection"
        value: "1; mode=block"
