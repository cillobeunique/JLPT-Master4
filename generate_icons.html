<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Generate PNG Icons for JLPT N4</title>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; padding: 2rem;">
  <h2>Generating JLPT N4 PNG Icons...</h2>
  <div id="status">Loading...</div>
  <div id="previews" style="display: flex; gap: 1rem; margin-top: 1rem; flex-wrap: wrap;"></div>

  <script>
    const svgText = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="n4grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="10" stroke-opacity="0.4"/>
  <text x="256" y="380" text-anchor="middle" font-family="'Noto Sans JP', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="345" fill="url(#n4grad)" filter="url(#glow)">四</text>
</svg>`;

    async function generate() {
      const sizes = [
        { name: 'icon-512.png', size: 512, padding: 0 },
        { name: 'icon-maskable-512.png', size: 512, padding: 48 },
        { name: 'icon-192.png', size: 192, padding: 0 },
        { name: 'apple-touch-icon.png', size: 180, padding: 0 },
        { name: 'favicon.png', size: 64, padding: 0 }
      ];

      const results = {};

      for (const item of sizes) {
        const canvas = document.createElement('canvas');
        canvas.width = item.size;
        canvas.height = item.size;
        const ctx = canvas.getContext('2d');

        if (item.padding > 0) {
          ctx.fillStyle = '#0b0f19';
          ctx.fillRect(0, 0, item.size, item.size);
        }

        const img = new Image();
        const svgBase64 = btoa(unescape(encodeURIComponent(svgText)));
        const url = 'data:image/svg+xml;base64,' + svgBase64;

        await new Promise((resolve) => {
          img.onload = () => {
            const drawSize = item.size - (item.padding * 2);
            ctx.drawImage(img, item.padding, item.padding, drawSize, drawSize);
            resolve();
          };
          img.onerror = () => {
            console.error('Image load error for ' + item.name);
            resolve();
          };
          img.src = url;
        });

        const dataUrl = canvas.toDataURL('image/png');
        results[item.name] = dataUrl;

        const ta = document.createElement('textarea');
        ta.id = 'data_' + item.name.replace('.png', '').replace(/-/g, '_');
        const b64 = dataUrl.split(',')[1];
        ta.value = b64;
        ta.textContent = b64;
        document.body.appendChild(ta);

        const preview = document.createElement('div');
        preview.innerHTML = `<p>${item.name} (${item.size}x${item.size})</p>`;
        canvas.style.border = '1px solid #444';
        canvas.style.maxWidth = '100px';
        canvas.style.height = 'auto';
        preview.appendChild(canvas);
        document.getElementById('previews').appendChild(preview);
      }

      window.generatedIcons = results;
      document.getElementById('status').textContent = 'DONE_GENERATING';
    }

    window.addEventListener('DOMContentLoaded', generate);
  </script>
</body>
</html>
